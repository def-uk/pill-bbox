<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="430" viewBox="0 0 1152 430" role="img" aria-labelledby="archTitle archDesc"><title id="archTitle">YOLO11m 아키텍처: Backbone, 다중 해상도 결합, Detect</title><desc id="archDesc">640 입력에서 P3 80×80, P4 40×40, P5 20×20 특징을 추출하고, 업샘플 및 다운샘플 경로로 결합해 세 검출 출력으로 전달한다. 채널과 반복 수는 생략한 개념도다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#29756c"/></marker></defs><rect width="1152" height="430" fill="#f3f1e9"/><rect x="10" y="35" width="320" height="365" rx="12" fill="none" stroke="#cad4ce"/><text x="30" y="24" fill="#29756c" text-anchor="start" font-size="16" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">BACKBONE / 특징 추출</text><rect x="353" y="35" width="515" height="365" rx="12" fill="none" stroke="#cad4ce"/><text x="373" y="24" fill="#29756c" text-anchor="start" font-size="16" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">FEATURE FUSION / 특징 결합</text><rect x="890" y="35" width="250" height="365" rx="12" fill="none" stroke="#cad4ce"/><text x="910" y="24" fill="#29756c" text-anchor="start" font-size="16" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">DETECT / 다중 크기 예측</text><polyline points="169,100 169,116" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="169,176 169,200" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="169,260 169,284" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="314,146 350,146 350,100 390,100" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="314,230 370,230 370,194 390,194" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="314,322 370,322 370,214 390,214" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="498,164 498,132" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="608,100 692,100" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="758,130 758,164" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="758,224 758,258" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="608,194 676,194 676,184 692,184" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="314,344 660,344 660,300 692,300" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="824,100 910,100" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="824,194 910,194" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><polyline points="824,288 910,288" fill="none" stroke="#29756c" stroke-width="2.5"  marker-end="url(#arrow)"/><rect x="24" y="48" width="290" height="52" rx="7" fill="#fffefa" stroke="#b8c6bf"/><text x="169.0" y="73" fill="#172c38" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">Input 640 × 640</text><text x="169.0" y="94" fill="#657078" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">Conv → Conv → C3k2</text><rect x="24" y="116" width="290" height="60" rx="7" fill="#fffefa" stroke="#b8c6bf"/><text x="169.0" y="141" fill="#172c38" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">P3 / stride 8</text><text x="169.0" y="162" fill="#657078" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">Conv → C3k2 · 80 × 80</text><rect x="24" y="200" width="290" height="60" rx="7" fill="#fffefa" stroke="#b8c6bf"/><text x="169.0" y="225" fill="#172c38" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">P4 / stride 16</text><text x="169.0" y="246" fill="#657078" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">Conv → C3k2 · 40 × 40</text><rect x="24" y="284" width="290" height="76" rx="7" fill="#fffefa" stroke="#b8c6bf"/><text x="169.0" y="309" fill="#172c38" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">P5 / stride 32</text><text x="169.0" y="330" fill="#657078" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">Conv → C3k2 → SPPF → C2PSA</text><rect x="390" y="164" width="218" height="60" rx="7" fill="#fffefa" stroke="#b8c6bf"/><text x="499.0" y="189" fill="#172c38" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">P4 fusion</text><text x="499.0" y="210" fill="#657078" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">Upsample + Concat + C3k2</text><rect x="390" y="70" width="218" height="60" rx="7" fill="#fffefa" stroke="#b8c6bf"/><text x="499.0" y="95" fill="#172c38" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">P3 fusion</text><text x="499.0" y="116" fill="#657078" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">Upsample + Concat + C3k2</text><rect x="692" y="70" width="132" height="60" rx="7" fill="#172c38" stroke="#b8c6bf"/><text x="758.0" y="95" fill="#fffefa" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">P3 head</text><text x="758.0" y="116" fill="#b9cfca" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">80 × 80</text><rect x="692" y="164" width="132" height="60" rx="7" fill="#172c38" stroke="#b8c6bf"/><text x="758.0" y="189" fill="#fffefa" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">P4 · C3k2</text><text x="758.0" y="210" fill="#b9cfca" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">Conv↓ + Concat</text><rect x="692" y="258" width="132" height="60" rx="7" fill="#172c38" stroke="#b8c6bf"/><text x="758.0" y="283" fill="#fffefa" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">P5 · C3k2</text><text x="758.0" y="304" fill="#b9cfca" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">Conv↓ + Concat</text><rect x="910" y="70" width="210" height="60" rx="7" fill="#172c38" stroke="#b8c6bf"/><text x="1015.0" y="95" fill="#fffefa" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">Detect P3</text><text x="1015.0" y="116" fill="#b9cfca" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">bbox + class scores</text><rect x="910" y="164" width="210" height="60" rx="7" fill="#172c38" stroke="#b8c6bf"/><text x="1015.0" y="189" fill="#fffefa" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">Detect P4</text><text x="1015.0" y="210" fill="#b9cfca" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">bbox + class scores</text><rect x="910" y="258" width="210" height="60" rx="7" fill="#172c38" stroke="#b8c6bf"/><text x="1015.0" y="283" fill="#fffefa" text-anchor="middle" font-size="18" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">Detect P5</text><text x="1015.0" y="304" fill="#b9cfca" text-anchor="middle" font-size="13" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">bbox + class scores</text><text x="610" y="374" fill="#657078" text-anchor="middle" font-size="15" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">↑ 업샘플 결합    /    ↓ 다운샘플 결합</text><text x="1015" y="365" fill="#db5c35" text-anchor="middle" font-size="17" font-weight="700" font-family="Arial, Malgun Gothic, sans-serif">3개 출력 → NMS</text><text x="575" y="422" fill="#657078" text-anchor="middle" font-size="14" font-weight="400" font-family="Arial, Malgun Gothic, sans-serif">공식 yolo11.yaml 기반 개념도 · 채널·반복 수 생략 · 특징 크기는 640 입력 기준</text></svg>